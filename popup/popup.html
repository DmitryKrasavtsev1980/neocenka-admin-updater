<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Неоценка Updater</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🔄 Неоценка Updater</h1>

    <div class="status-bar" id="statusBar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Остановлен</span>
    </div>

    <div class="stats" id="stats">
      <div class="stat">
        <span class="stat-value" id="processed">0</span>
        <span class="stat-label">Обработано</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="matched">0</span>
        <span class="stat-label">Обновлено</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="errors">0</span>
        <span class="stat-label">Ошибки</span>
      </div>
    </div>

    <div class="config-info" id="configInfo">
      <div class="config-row"><span class="config-label">Источник</span><span id="cfgSource">—</span></div>
      <div class="config-row"><span class="config-label">Батч</span><span id="cfgBatch">—</span></div>
      <div class="config-row"><span class="config-label">Опрос</span><span id="cfgPoll">—</span></div>
      <div class="config-row"><span class="config-label">Автоочередь</span><span id="cfgAuto">—</span></div>
    </div>
    <div class="config-hint">Настройки приходят с сервера</div>

    <div class="buttons">
      <button id="startBtn" class="btn btn-primary">▶ Запустить</button>
      <button id="stopBtn" class="btn btn-danger" disabled>⏹ Остановить</button>
    </div>

    <div class="log" id="log"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
